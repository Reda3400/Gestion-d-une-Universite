
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFlow | University Management</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: Inter, system-ui, sans-serif;
        }

        .active-link {
            background: #eef2ff;
            color: #4338ca;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-gray-200
                  hidden md:flex flex-col">

        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-indigo-600">
                CampusFlow
            </h1>
            <p class="text-xs text-gray-400 mt-1">
                University Management
            </p>
        </div>

        <nav class="p-4 space-y-2 flex-1">

            <p class="text-xs text-gray-400 uppercase mb-3">
                Main Menu
            </p>

            <button data-page="dashboard"
                class="nav-link active-link w-full text-left p-3 rounded-lg">
                Dashboard
            </button>

            <button data-page="users"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Users
            </button>

            <button data-page="courses"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Courses
            </button>

            <button data-page="timetable"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Timetable
            </button>

            <button data-page="library"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Library
            </button>

            <button data-page="reservations"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Reservations
            </button>

            <button data-page="events"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Events
            </button>

            <button data-page="support"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Support
            </button>

            <button data-page="administration"
                class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100">
                Administration
            </button>

        </nav>

        <div class="p-4 border-t">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-100
                            flex items-center justify-center
                            text-indigo-600 font-bold">
                    A
                </div>
                <div>
                    <p class="text-sm font-semibold">Administrator</p>
                    <p class="text-xs text-gray-400">admin@campus.com</p>
                </div>
            </div>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">

        <!-- TOPBAR -->
        <header class="bg-white border-b px-6 py-4
                       flex items-center justify-between">

            <div>
                <h2 id="page-title" class="text-xl font-bold">
                    Dashboard
                </h2>
                <p class="text-sm text-gray-400">
                    University Management Platform
                </p>
            </div>

            <div class="flex items-center gap-4">

                <button id="notification-button"
                    class="relative p-2 rounded-lg hover:bg-gray-100">
                    Notifications
                    <span id="notification-count"
                        class="absolute -top-1 -right-1 bg-red-500
                               text-white text-xs rounded-full
                               px-1.5">
                        0
                    </span>
                </button>

                <button id="logout-button"
                    class="text-sm text-gray-500 hover:text-red-600">
                    Logout
                </button>

            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="p-6">

            <!-- DASHBOARD -->
            <section id="dashboard" class="page active">

                <div class="mb-6">
                    <h2 class="text-2xl font-bold">
                        Welcome to CampusFlow
                    </h2>
                    <p class="text-gray-500 mt-1">
                        Here's what's happening at your university.
                    </p>
                </div>

                <div id="dashboard-statistics"
                    class="grid grid-cols-1 sm:grid-cols-2
                           lg:grid-cols-4 gap-4">

                    <div class="bg-white p-5 rounded-xl border">
                        <p class="text-sm text-gray-400">Students</p>
                        <h3 class="text-3xl font-bold mt-2">--</h3>
                    </div>

                    <div class="bg-white p-5 rounded-xl border">
                        <p class="text-sm text-gray-400">Teachers</p>
                        <h3 class="text-3xl font-bold mt-2">--</h3>
                    </div>

                    <div class="bg-white p-5 rounded-xl border">
                        <p class="text-sm text-gray-400">Courses</p>
                        <h3 class="text-3xl font-bold mt-2">--</h3>
                    </div>

                    <div class="bg-white p-5 rounded-xl border">
                        <p class="text-sm text-gray-400">Events</p>
                        <h3 class="text-3xl font-bold mt-2">--</h3>
                    </div>

                </div>

                <div class="mt-6 bg-white border rounded-xl p-6">
                    <h3 class="font-bold mb-4">Recent Activity</h3>
                    <div id="recent-activity">
                        <p class="text-gray-400 text-sm">
                            No recent activity.
                        </p>
                    </div>
                </div>

            </section>

            <!-- USERS -->
            <section id="users" class="page">
                <div id="users-app"></div>
            </section>

            <!-- COURSES -->
            <section id="courses" class="page">
                <div id="courses-app"></div>
            </section>

            <!-- TIMETABLE -->
            <section id="timetable" class="page">
                <div id="timetable-app"></div>
            </section>

            <!-- LIBRARY -->
            <section id="library" class="page">
                <div id="library-app"></div>
            </section>

            <!-- RESERVATIONS -->
            <section id="reservations" class="page">
                <div id="reservations-app"></div>
            </section>

            <!-- EVENTS -->
            <section id="events" class="page">
                <div id="events-app"></div>
            </section>

            <!-- SUPPORT -->
            <section id="support" class="page">
                <div id="support-app"></div>
            </section>

            <!-- ADMINISTRATION -->
            <section id="administration" class="page">
                <div id="administration-app"></div>
            </section>

        </div>

    </main>

</div>

<!-- NOTIFICATIONS CONTAINER -->
<div id="notification-panel"
     class="hidden fixed top-20 right-6 w-80 max-w-[90vw]
            bg-white border shadow-xl rounded-xl p-4 z-50">
    <h3 class="font-bold mb-3">Notifications</h3>
    <div id="notification-list"></div>
</div>

<!-- APPLICATION JAVASCRIPT -->
<script type="module" src="./js/main.js"></script>

</body>
</html>
